[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pyground-repl"
version = "0.1.0"
description = "A split-screen Python editor and live REPL for the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0,<9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
pyground = "pyground.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
