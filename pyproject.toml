[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[project]
name = "scrappad"
version = "0.1.0"
description = "A split-screen Python editor and live REPL for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Angus Stewart", email = "siliconlad@protonmail.com" },
]
keywords = ["python", "repl", "terminal", "tui", "text-editor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=8.0,<9",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/siliconlad/scrappad"
Repository = "https://github.com/siliconlad/scrappad.git"
Issues = "https://github.com/siliconlad/scrappad/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
scrappad = "scrappad.cli:main"

[tool.uv.build-backend]
module-name = "scrappad"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
