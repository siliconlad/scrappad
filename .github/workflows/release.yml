---
name: Release to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Verify release source and read package version
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be run from the main branch, not $GITHUB_REF" >&2
            exit 1
          fi

          package_version="$(uv version --short)"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Install the project
        run: uv sync --locked --python 3.12

      - name: Run tests
        run: uv run --python 3.12 pytest

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/smoke_package.py

      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_package.py

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish PyPI version ${{ needs.build.outputs.version }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scrappad/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # Required for short-lived PyPI Trusted Publishing credentials.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
