---
name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match pyproject.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Verify release source and version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be run from the main branch, not $GITHUB_REF" >&2
            exit 1
          fi
          package_version="$(uv version --short)"
          if [[ "$package_version" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match package version $package_version" >&2
            exit 1
          fi
        env:
          REQUESTED_VERSION: ${{ inputs.version }}

      - name: Install the project
        run: uv sync --locked --python 3.12

      - name: Run tests
        run: uv run --python 3.12 pytest

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/smoke_package.py

      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_package.py

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyground-repl
    permissions:
      id-token: write  # Required for short-lived PyPI Trusted Publishing credentials.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
